<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="cometGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fundo Circular Roxo Profundo com Borda Neon -->
  <circle cx="160" cy="160" r="150" fill="#150a24" stroke="url(#cometGrad)" stroke-width="3.5" />
  <circle cx="160" cy="160" r="142" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="5,4" />

  <!-- Feixes / Rastro da Cauda do Cometa em Roxo e Branco -->
  <path d="M52 238 C85 220, 130 175, 215 105 C160 155, 110 205, 78 248 Z" fill="url(#cometGrad)" opacity="0.9" filter="url(#purpleGlow)"/>
  <path d="M80 220 C115 195, 155 150, 230 92 C180 140, 135 185, 105 225 Z" fill="#c084fc" opacity="0.8"/>
  <path d="M110 195 C145 168, 185 125, 245 80 C205 122, 160 160, 130 198 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Cabeça / Núcleo do Cometa (Estrela Esportiva Branca) -->
  <polygon points="238,62 268,98 252,122 216,108 202,82" fill="url(#whiteGrad)" filter="url(#purpleGlow)"/>
  <polygon points="244,72 262,98 250,114 224,104 214,86" fill="#ffffff" />

  <!-- Raios de Velocidade Cósmica Brancos -->
  <line x1="250" y1="52" x2="288" y2="38" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#purpleGlow)"/>
  <line x1="275" y1="78" x2="305" y2="70" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270" y1="110" x2="298" y2="122" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Tipografia COMET ESPORTS em Branco e Roxo -->
  <text x="160" y="278" font-family="'Space Grotesk', Impact, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="5" filter="url(#purpleGlow)">COMET</text>
  <text x="160" y="296" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="3">ESPORTS</text>
</svg>